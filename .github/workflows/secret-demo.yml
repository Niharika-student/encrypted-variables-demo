
name: Encrypted Variables Demo

on:
  push:
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest

    env:
      DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
      APP_ENV: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check encrypted secret
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is configured successfully"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Display normal variable
        run: echo "Application environment: $APP_ENV"
