
name: Encrypted Variables Demo

on:
  push:
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest

    env:
      DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
      APP_ENV: testing

    steps:
      - name: Check secret
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret configured successfully"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Display variable
        run: echo "Environment is $APP_ENV"
